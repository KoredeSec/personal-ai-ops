name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app scripts tests
      # Tests run fully offline: no Telegram or Gemini credentials needed.
      - run: python -m pytest -q
      - name: Migrations apply cleanly from scratch
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci.db
        run: alembic upgrade head && alembic check

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # pip-audit is a CI-only tool: checks pinned deps against known CVEs.
      - run: pip install pip-audit && pip-audit -r requirements.txt

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history, not just the latest commit
      - name: gitleaks (official image, pinned)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t personal-ai-ops:ci .
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id personal-ai-ops:ci -u)" != "0"
